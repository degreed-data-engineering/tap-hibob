[tool.poetry]
name = "tap-hibob"
version = "0.0.3"
description = "`tap-hibob` is Singer-compliant hibob tap built with Singer SDK."
authors = ["Merve Eren <meren@degreed.com>"]
license = "Apache v2"

[tool.poetry.dependencies]
python = ">=3.9.2,<3.13"
requests = "^2.32.4"
# singer-sdk 0.48.x is the last line supporting Python 3.9; it drops the cryptography<4 cap
# that kept CVE-2023-50782 (cryptography 3.4.8) in this tap's venv (PD-132295).
singer-sdk = "^0.48.1"
cryptography = "^44.0.1"

[tool.poetry.dev-dependencies]
pytest = "^6.2.5"
tox = "^3.24.4"
flake8 = "^3.9.2"
black = "^21.9b0"
pydocstyle = "^6.1.1"
mypy = "^0.910"
types-requests = "^2.26.1"
isort = "^5.10.1"

[tool.poetry.group.dev.dependencies]
viztracer = "^0.15.4"

[tool.isort]
profile = "black"
multi_line_output = 3 # Vertical Hanging Indent
src_paths = "tap_hibob"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# CLI declaration
tap-hibob = 'tap_hibob.tap:cli'
